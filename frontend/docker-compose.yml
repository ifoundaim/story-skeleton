# docker-compose.yml
version: "3.9"

#######################################################################
#  • Single bridge network (“app-net”) so every container can         #
#    reach the others by service-name.                               #
#  • Postgres image already ships with the pgvector extension.       #
#  • FastAPI starts only after Postgres is healthy.                  #
#  • Vite dev-server proxies to FastAPI via VITE_BACKEND env-var.    #
#######################################################################

services:
  # ──────────────────────────── DATABASE ─────────────────────────────
  db:
    image: ankane/pgvector:pg15          # Postgres 15 + pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB:       purposepath
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ────────────────────────────── API ───────────────────────────────
  api:
    build:
      context: ./backend             # contains backend/Dockerfile
      dockerfile: Dockerfile
    env_file: .env                   # POSTGRES_URL must point to “db”
    depends_on:
      db:
        condition: service_healthy    # wait until Postgres is ready
    ports:
      - "8000:8000"                   # host:container
    networks:
      - app-net
    environment:
      - SYNC_MEDIA_GENERATION=true

  # ───────────────────────────── WEB ────────────────────────────────
  web:
    build:
      context: ./frontend            # contains frontend/Dockerfile
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND: "http://api:8000"  # → used by Vite proxy
    depends_on:
      - api
    command: yarn dev --host
    ports:
      - "5173:5173"
    networks:
      - app-net
#    volumes:
#      - ./frontend:/app

# ─────────────────────────── STORAGE (optional) ─────────────────────
# Uncomment to spin up a local MinIO bucket for uploads
#
# minio:
#   image: minio/minio:latest
#   command: server /data --console-address ":9001"
#   environment:
#     MINIO_ROOT_USER:     ${S3_ACCESS_KEY}
#     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
#   volumes:
#     - minio-data:/data
#   ports:
#     - "9000:9000"  # S3 API
#     - "9001:9001"  # Admin console
#   networks:
#     - app-net

# ─────────────────────────── VOLUMES & NETWORKS ─────────────────────
volumes:
  dbdata:
  # minio-data:

networks:
  app-net:
    driver: bridge
